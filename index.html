.leaflet-bar a:hover,

async function search(){const q=el('placeSearch').value.trim();if(q.length<2){el('suggestions').hidden=true;return}el('suggestions').hidden=false;el('suggestions').innerHTML='<div class="state">청주시 안에서 찾는 중…</div>';try{const d=await api('/api/kakao/search?q='+encodeURIComponent(q)),docs=d.documents||[];el('suggestions').innerHTML=docs.length?docs.map((x,i)=>'<button class="suggestion" type="button" data-i="'+i+'"><strong>'+esc(x.place_name||x.address_name)+'</strong><span>'+esc(x.road_address_name||x.address_name)+'</span></button>').join(''):'<div class="state">검색 결과가 없습니다.</div>';el('suggestions').querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=docs[+b.dataset.i],lat=+x.y,lng=+x.x,g=district(lat,lng);if(!g)return;setOrigin({name:x.place_name||x.address_name,address:x.road_address_name||x.address_name,district:g.properties.adm_nm,latitude:lat,longitude:lng});el('placeSearch').value=x.place_name||x.address_name;el('suggestions').hidden=true})}catch(e){el('serverAlert').hidden=false;el('suggestions').innerHTML='<div class="state">검색 서버 연결을 확인해주세요.</div>'}}async function loadWeather(lat,lng){el('weather').innerHTML='<strong>날씨 확인 중</strong><span>추천에 자동 반영</span>';try{const d=await api('/api/weather?lat='+lat+'&lng='+lng),c=d.current||{},code=+c.weather_code;weather=code>=51&&code<=99?'rain':'good';el('weather').innerHTML='<strong>'+Math.round(c.temperature_2m)+'℃ · '+(weather==='rain'?'실내 우선':'야외 적합')+'</strong><span>현재 날씨 자동 반영</span>'}catch(e){el('weather').innerHTML='<strong>기본 추천</strong><span>날씨 연결 확인 필요</span>'}}el('placeSearch').oninput=()=>{clearTimeout(timer);timer=setTimeout(search,260)};el('searchButton').onclick=search;
function mins(a,b){const x=a.split(':').map(Number),y=b.split(':').map(Number);return y[0]*60+y[1]-x[0]*60-x[1]}function clock(a,n){const x=a.split(':').map(Number),t=x[0]*60+x[1]+Math.round(n);return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function dist(a,b){const R=6371,x=(b.latitude-a.latitude)*Math.PI/180,y=(b.longitude-a.longitude)*Math.PI/180,p=a.latitude*Math.PI/180,q=b.latitude*Math.PI/180;return 2*R*Math.asin(Math.sqrt(Math.sin(x/2)**2+Math.cos(p)*Math.cos(q)*Math.sin(y/2)**2))}function travel(a,b,m){const k=dist(a,b);return m==='walk'?k/4.5*60:m==='taxi'||m==='car'?k/34*60+5:k/20*60+9}function interestMatch(t){const interest=el('interest').value;if(interest==='balanced')return 1;if(interest==='culture')return['culture','history','event'].includes(t)?1:0;if(interest==='food')return t==='food'?1:0;if(interest==='shopping')return t==='shopping'?1:0;return['nature','leisure'].includes(t)?1:0}function weatherMatch(t){return weather==='rain'?(['nature','leisure'].includes(t)?0:1):1}function gradePriority(p){return p.demand_evidence_grade==='A'?2:p.demand_evidence_grade==='B'?1:0}function signalValue(p){return p.demand_evidence_grade==='A'?Number(p.navigation_search_count||0):Number(p.recent_search_count||0)}function audienceScore(p){const view=el('audience').value,r=DATA.region_demand.find(x=>x.region_key===p.region_key);if(!r||view==='all')return 0;if(view==='domestic')return Number(r.visitor_share_pct||0)+Number(r.domestic_spending_share_pct||0);return Number(r.foreign_spending_share_pct||0)}function chooseStorage(o,h,m){return[...DATA.storage].sort((a,b)=>(travel(o,a,m)+travel(a,h,m))-(travel(o,b,m)+travel(b,h,m)))[0]}function candidateCompare(a,b){return interestMatch(b.place_type)-interestMatch(a.place_type)||weatherMatch(b.place_type)-weatherMatch(a.place_type)||gradePriority(b)-gradePriority(a)||audienceScore(b)-audienceScore(a)||Number(b.naver_interest?.blog_search_total||0)-Number(a.naver_interest?.blog_search_total||0)||signalValue(b)-signalValue(a)||a.distance-b.distance}function openResult(){el('resultPanel').hidden=false;el('reopen').hidden=true}
let naverEnabled=null;async function enrichNaver(cands){if(naverEnabled===null){try{naverEnabled=(await api('/api/status')).naver===true}catch(e){naverEnabled=false}}if(!naverEnabled)return cands;const shortlist=cands.slice(0,8);await Promise.all(shortlist.map(async p=>{try{p.naver_interest=await api('/api/naver/interest?name='+encodeURIComponent(p.name))}catch(e){p.naver_interest=null}}));const ranked=shortlist.filter(p=>p.naver_interest?.configured).sort((a,b)=>Number(b.naver_interest.blog_search_total||0)-Number(a.naver_interest.blog_search_total||0));ranked.forEach((p,i)=>{p.naver_interest_rank=i+1;p.naver_interest_scope=ranked.length});return cands.sort(candidateCompare)}
async function render(){if(!origin)return;const h=DATA.hubs.find(x=>x.id===el('hub').value),m=el('mode').value,start=el('startTime').value,total=mins(start,el('departureTime').value),audience=el('audience').value,interest=el('interest').value;if(total<=h.buffer_minutes+30){el('result').innerHTML='<div class="warning">교통편 출발까지 남은 시간이 너무 짧습니다. 시각을 다시 확인해주세요.</div>';return openResult()}const button=el('recommend'),oldLabel=button.textContent;button.disabled=true;button.textContent='수요 근거 확인 중…';try{const s=chooseStorage(origin,h,m),drop=travel(origin,s,m),budget=total-h.buffer_minutes-20-drop;let cands=DATA.places.filter(p=>p.recommendation_role!=='explore_only'&&dist(s,p)<(m==='walk'?3.5:13)).map(p=>Object.assign({},p,{distance:dist(s,p)})).sort(candidateCompare);cands=await enrichNaver(cands);let sel=[],cur=s,used=0;for(const p of cands){if(sel.length>=2)break;const leg=travel(cur,p,m),back=travel(p,s,m)+travel(s,h,m);if(used+leg+p.dwell_minutes+back<=budget){sel.push(Object.assign({},p,{leg}));used+=leg+p.dwell_minutes;cur=p}}let e=drop+10,tl=[{t:clock(start,0),n:origin.name,m:'짐 소지'},{t:clock(start,e),n:s.name,m:'짐 맡기기 10분'}],coords=[[origin.latitude,origin.longitude],[s.latitude,s.longitude]];sel.forEach(p=>{e+=p.leg;const online=p.naver_interest_rank?' · 네이버 관심 '+p.naver_interest_rank+'위/'+p.naver_interest_scope:'';tl.push({t:clock(start,e),n:p.name,m:TYPE_LABEL[p.place_type]+' · '+p.dwell_minutes+'분 · 근거 '+p.demand_evidence_grade+online});e+=p.dwell_minutes;coords.push([p.latitude,p.longitude])});e+=travel(cur,s,m);tl.push({t:clock(start,e),n:s.name,m:'짐 회수'});e+=10+travel(s,h,m);tl.push({t:clock(start,e),n:h.name,m:'출발 '+h.buffer_minutes+'분 전 도착'});coords.push([s.latitude,s.longitude],[h.latitude,h.longitude]);groups.route.clearLayers();L.polyline(coords,{color:'#1769e0',weight:5,dashArray:'9 7'}).addTo(groups.route);map.fitBounds(L.latLngBounds(coords),{padding:[60,150]});const audienceLabels={all:'전체 수요',domestic:'내국인 방문·소비',foreign:'외국인 소비 프록시'},interestLabels={balanced:'균형',food:'미식',shopping:'쇼핑·뷰티',culture:'문화·역사',nature:'자연·레저'},grades=sel.map(p=>p.demand_evidence_grade).join('·')||'-',method=naverEnabled?'관광공사 근거를 우선하고 네이버 온라인 관심도를 동급 후보의 보조순위로 적용했습니다.':'네이버 키 연결 전이라 관광공사 근거만 적용했습니다.',official='<div class="source-note"><b>추천이 겨냥하는 전환</b><br>청주공항 방한객은 전년보다 '+DATA.official_benchmarks.cheongju_inbound_growth_pct+'% 늘었지만 충북 내 이동은 '+DATA.official_benchmarks.chungbuk_movement_share_pct+'%, 수도권 이동은 '+DATA.official_benchmarks.capital_movement_share_pct+'%입니다. 이 경로는 짐과 남는 시간의 제약을 줄여 청주 안의 추가 방문과 소비 기회를 만드는 시연입니다.</div>',audienceNote=audience==='foreign'?'<div class="warning">외국인 관점은 외국인 방문자 수가 아니라 지역별 카드지출 비중 프록시입니다. 대만·일본·중국 20대 여성이라는 공항 핵심층은 서비스 기획 타깃이며, 개인의 국적·성별을 추정하지 않습니다.</div>':'',proof=naverEnabled?'<div class="source-note"><b>네이버 온라인 관심도</b><br>'+sel.map(p=>{const n=p.naver_interest;if(!n)return esc(p.name)+' · 확인 실패';return '<a href=\"'+esc(n.naver_place_url)+'\" target=\"_blank\" rel=\"noopener\">'+esc(p.name)+'</a> · 비교후보 '+(p.naver_interest_rank||'-')+'위/'+(p.naver_interest_scope||'-')+' · 블로그 검색결과 '+fmt(n.blog_search_total)+'건'}).join('<br>')+'<br>리뷰 수·별점이 아니며 동명이인, 홍보글, 중복 문서가 포함될 수 있는 보조 프록시입니다.</div>':'<div class="source-note"><b>네이버 연결 대기</b><br>.Renviron.naver에 Client ID와 Secret을 저장하면 온라인 관심도 보조순위가 자동 활성화됩니다.</div>';el('result').innerHTML='<div class="result-head"><div><h2>짐을 맡기면 청주 '+sel.length+'곳을 더 둘러볼 수 있습니다</h2><p>'+esc(s.name)+' 기준 · '+method+'</p></div><div class="stats"><div class="stat"><b>'+sel.reduce((a,p)=>a+p.dwell_minutes,0)+'분</b><span>관광시간</span></div><div class="stat"><b>'+sel.length+'곳</b><span>추가 방문</span></div><div class="stat"><b>'+grades+'</b><span>KTO 근거</span></div><div class="stat"><b>'+esc(interestLabels[interest])+'</b><span>'+esc(audienceLabels[audience])+'</span></div></div></div><div class="timeline">'+tl.map(x=>'<div class="stop"><div class="time">'+x.t+'</div><div class="name">'+esc(x.n)+'</div><div class="meta">'+esc(x.m)+'</div></div>').join('')+'</div>'+official+proof+audienceNote+'<div class="warning">보관거점은 실증 전 후보입니다. 이동시간은 직선거리 기반 추정치이며, 실제 대중교통 경로·보관 가능 여부는 운영 전에 검증해야 합니다.</div>';openResult()}finally{button.disabled=false;button.textContent=oldLabel}}
el('trip').onsubmit=e=>{e.preventDefault();render()};el('close').onclick=()=>{el('resultPanel').hidden=true;el('reopen').hidden=false};el('reopen').onclick=openResult;el('layersBtn').onclick=()=>{el('layers').hidden=!el('layers').hidden;el('insightPanel').hidden=true};el('insightBtn').onclick=()=>{el('insightPanel').hidden=!el('insightPanel').hidden;el('layers').hidden=true};el('insightClose').onclick=()=>el('insightPanel').hidden=true;[['layerDistricts','districts'],['layerPlaces','places'],['layerStorage','storage'],['layerParking','parking'],['layerDemand','demand']].forEach(([i,k])=>el(i).onchange=e=>e.target.checked?groups[k].addTo(map):map.removeLayer(groups[k]));window.onload=()=>setTimeout(()=>{map.invalidateSize();map.fitBounds(districtLayer.getBounds(),{padding:[18,18]});if(location.protocol==='file:')el('serverAlert').hidden=false},100);
